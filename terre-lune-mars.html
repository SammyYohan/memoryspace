else{rk.visible=false;pos(F.at,tA);rp.copy(tA).addScaledVector(F.park,PL[F.at].r+.7);tg.copy(F.park);

dd.copy(tg);if(F.st=='fly'){dd.lerp(F.park1,ss(.8,.98,F.u));dd.lerp(F.park0,1-ss(0,.1,F.u))}dd.normalize();qq.setFromUnitVectors(UP,dd);rk.quaternion.slerp(qq,1-Math.exp(-dt*8));

for(let i=0;i<TN;i++){const k=i*3;TPA[i]+=dt;const f=Math.max(0,1-TPA[i]/TLIFE),q=f*f;TPP[k]+=TPV[k]*dt;TPP[k+1]+=TPV[k+1]*dt;TPP[k+2]+=TPV[k+2]*dt;TPC[k]=q;TPC[k+1]=q*L(.75,.2,1-f);TPC[k+2]=q*L(.95,.05,1-f)}
